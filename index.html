<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap"
    rel="stylesheet">
  <title>Colorya — Coolors Clone Project (práctica de JS/DOM)</title>
</head>
<body id="body" class="body">
  <div class="main_container">
    <div class="column_colors">
      <div class="color">
        <p class="color_code"></p>
      </div>
      <div class="color">
        <p class="color_code"></p>
      </div>
      <div class="color">
        <p class="color_code"></p>
      </div>
      <div class="color">
        <p class="color_code"></p>
      </div>
      <div class="color">
        <p class="color_code"></p>
      </div>
    </div>
    <button class="btn-random">
      Random
    </button>
  </div>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Rethink Sans", sans-serif;
    }

    body {
      padding: 10px;
      height: 100vh;
      width: 100%;
      border-radius: 20px;
    }

    .main_container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .column_colors {
      width: 100%;
      height: 100%;
      display: flex;
    }

    .color {
      flex: 1;
      height: 100%;
      margin: 0 5px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .color_code {
      font-size: 40px;
    }

    .btn-random {
      display: flex;
      margin: 30px 5px;
      padding: 10px 10px;
      max-width: max-content;
    }

    @media screen and (max-width: 768px) {
      .column_colors {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .color {
        background-color: #123abc;
        flex: 1;
        height: 100%;
        margin: 5px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .color_code {
        font-size: 30px;
      }
    }

  </style>
  <script src="app.js"></script>
</body>
</html>
